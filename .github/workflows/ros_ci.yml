name: ROS 2 CI & Publish

on:
  push:
    branches: [ main, master, ros2-development ]
  pull_request:
    branches: [ main, master, ros2-development ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ros_build_test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install dependencies and build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-colcon-common-extensions
          python3 -m pip install scikit-fuzzy numpy opencv-python

          # Create colcon workspace with our source
          mkdir -p /tmp/ros_ws/src
          cp -r src/hybrid_navigation_msgs /tmp/ros_ws/src/
          cp -r src/hybrid_navigation /tmp/ros_ws/src/

          # Install rosdep dependencies
          cd /tmp/ros_ws
          rosdep update --rosdistro=humble
          rosdep install --from-paths src --ignore-src -r -y

          # Build
          colcon build --packages-select hybrid_navigation_msgs hybrid_navigation
          
          # Test
          colcon test --packages-select hybrid_navigation_msgs hybrid_navigation
          colcon test-result --verbose

  publish_image:
    runs-on: ubuntu-22.04
    needs: ros_build_test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
